<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAKU Facebook Post Downloads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550;9..144,700;9..144,800&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#17261c; --forest:#253f2f; --gold:#c99342; --clay:#9f5135; --paper:#fffaf0; --cream:#f3ead8; --line:rgba(37,63,47,.16); }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { padding:34px min(5vw,56px) 20px; display:flex; align-items:end; justify-content:space-between; gap:24px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-family:Fraunces,Georgia,serif; font-size:clamp(30px,4vw,54px); line-height:1; color:var(--forest); }
    .note { max-width:560px; margin:10px 0 0; color:#66715f; line-height:1.45; font-size:15px; }
    .brand-mark { width:150px; height:auto; object-fit:contain; }
    main { padding:30px min(5vw,56px) 56px; display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:28px; align-items:start; }
    .post-card { display:grid; gap:12px; }
    canvas { width:100%; aspect-ratio:1; display:block; background:var(--cream); box-shadow:0 22px 60px rgba(37,63,47,.14); border:1px solid var(--line); }
    .download { min-height:48px; border:0; border-radius:6px; background:var(--forest); color:white; font:inherit; font-weight:900; cursor:pointer; }
    .download:hover { background:#1b3023; }
    @media (max-width:720px) { header { align-items:start; flex-direction:column; } .brand-mark { width:128px; } main { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LAKU Facebook Posts</h1>
      <p class="note">Ten 1080 x 1080 lead-generation designs. Click download under any version to save it as a PNG for Facebook.</p>
    </div>
    <img class="brand-mark" src="images/laku/Laku%20logo.png" alt="LAKU">
  </header>

  <main id="posts"></main>

  <script>
    const size = 1080;
    const basePath = 'images/laku/';
    const assets = {
      logo: basePath + 'Laku%20logo.png',
      hero: basePath + 'optimized/hero-workshop.webp',
      craft: basePath + 'optimized/craft-detail.webp',
      table: basePath + 'optimized/table-offering.webp',
      weaving: basePath + 'optimized/weaving-values.webp',
      ibuWahyu: basePath + '20260810_111236.jpg',
      studio: basePath + 'laku-01.jpeg',
      porch: basePath + 'laku-02.jpeg',
      textile: basePath + '20260810_111259.jpg',
      gathering: basePath + '20260810_103046.jpg',
      hands: basePath + '20260807_121522.jpg'
    };
    const posts = [
      { name:'laku-facebook-01-living-culture.png', title:"A Home for Indonesia's Living Culture", kicker:'MAWUN, LOMBOK', body:'Meet Culture Keepers, join hands-on workshops, and experience traditions through real daily practice.', cta:'Plan your visit at lakuculture.id', image:'hero', style:'hero' },
      { name:'laku-facebook-02-workshops.png', title:'Make Lombok culture part of your journey.', kicker:'HANDS-ON WORKSHOPS', body:'Learn weaving, batik, pottery, bamboo, rattan, and culinary traditions directly with local Culture Keepers.', cta:'Book your workshop at lakuculture.id', image:'craft', style:'split' },
      { name:'laku-facebook-03-group-visits.png', title:'A meaningful program for your group in Lombok.', kicker:'SCHOOLS, TEAMS & RETREATS', body:'Bring students, teams, families, or travel guests into real cultural practice with guided private programs.', cta:'Request a private visit', image:'weaving', style:'band' },
      { name:'laku-facebook-04-meet-the-makers.png', title:'Every handmade piece carries a story.', kicker:'HANDMADE BY CULTURE KEEPERS', body:'Discover work shaped by local materials, patient hands, and traditions passed through generations.', cta:'Visit LAKU in Mawun', image:'table', style:'editorial' },
      { name:'laku-facebook-05-apprenticeship.png', title:'Learn by doing, not just watching.', kicker:'CULTURAL APPRENTICESHIPS', body:'Spend a week or more practicing beside Culture Keepers and leave with skills, stories, and a completion letter.', cta:'Apply at lakuculture.id', image:'ibuWahyu', style:'poster' },
      { name:'laku-facebook-06-website-leads.png', title:'Planning a Lombok trip? Add a cultural day at LAKU.', kicker:'VISIT LAKU CULTURE', body:'Workshops, handmade pieces, local food, storytelling, and warm hospitality in one living culture space.', cta:'Start here: lakuculture.id', image:'studio', style:'cream' },
      { name:'laku-facebook-07-travel-partners.png', title:'Give your guests a deeper Lombok experience.', kicker:'FOR HOTELS & TRAVEL PARTNERS', body:'Create memorable cultural programs for guests who want more than a regular tour.', cta:'Partner with LAKU', image:'porch', style:'partner' },
      { name:'laku-facebook-08-family-day.png', title:'A family day filled with culture, craft, and connection.', kicker:'FAMILY-FRIENDLY EXPERIENCES', body:'Slow down together, meet local makers, try traditional craft, and take home something meaningful.', cta:'Plan your family visit', image:'textile', style:'frame' },
      { name:'laku-facebook-09-community.png', title:'Support the people keeping culture alive.', kicker:'CULTURE KEEPER PROGRAMS', body:'Every visit helps create income, recognition, and continuity for local masters and the next generation.', cta:'Learn more at lakuculture.id', image:'gathering', style:'impact' },
      { name:'laku-facebook-10-last-call.png', title:'Ready for a real cultural experience in Lombok?', kicker:'WORKSHOPS NOW OPEN', body:'Choose your workshop, bring your group, or ask us to design a private program for your visit.', cta:'Inquire today: lakuculture.id', image:'hands', style:'cta' }
    ];
    const loaded = {};
    function loadImage(src) { return new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = src; }); }
    function cover(ctx, img, x, y, w, h) { const ratio = Math.max(w / img.naturalWidth, h / img.naturalHeight); const nw = img.naturalWidth * ratio; const nh = img.naturalHeight * ratio; ctx.drawImage(img, x + (w - nw) / 2, y + (h - nh) / 2, nw, nh); }
    function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    function fillRound(ctx, x, y, w, h, r, color) { ctx.fillStyle = color; roundRect(ctx, x, y, w, h, r); ctx.fill(); }
    function fitFillText(ctx, text, x, y, maxWidth) { while (ctx.measureText(text).width > maxWidth) { const size = Number(ctx.font.match(/\d+/)[0]); if (size <= 17) break; ctx.font = ctx.font.replace(/\d+px/, `${size - 1}px`); } ctx.fillText(text, x, y); }
    function drawCta(ctx, text, x, y, w, h, color = '#c99342', ink = '#21180b') { fillRound(ctx,x,y,w,h,6,color); ctx.fillStyle = ink; ctx.font = '900 25px Inter'; fitFillText(ctx,text,x + 24,y + Math.round(h / 2) + 9,w - 48); }
    function drawText(ctx, text, x, y, maxWidth, lineHeight, maxLines) { const words = text.split(' '); const lines = []; let line = ''; for (const word of words) { const test = line ? line + ' ' + word : word; if (ctx.measureText(test).width <= maxWidth || !line) line = test; else { lines.push(line); line = word; } } if (line) lines.push(line); const visible = maxLines ? lines.slice(0, maxLines) : lines; visible.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight)); return visible.length * lineHeight; }
    function overlay(ctx, color, alpha) { ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fillRect(0,0,size,size); ctx.restore(); }
    function drawLogo(ctx, x, y, w, light = true) { const logo = loaded.logo; const h = w / (logo.naturalWidth / logo.naturalHeight); if (!light) { ctx.save(); ctx.filter = 'brightness(0) saturate(100%) invert(16%) sepia(16%) saturate(1028%) hue-rotate(82deg) brightness(93%) contrast(89%)'; ctx.drawImage(logo, x, y, w, h); ctx.restore(); return h; } ctx.drawImage(logo, x, y, w, h); return h; }
    function drawHero(ctx, post) { cover(ctx, loaded[post.image], 0, 0, size, size); const grad = ctx.createLinearGradient(0,0,size,0); grad.addColorStop(0,'rgba(23,38,28,.96)'); grad.addColorStop(.56,'rgba(23,38,28,.70)'); grad.addColorStop(1,'rgba(23,38,28,.12)'); ctx.fillStyle = grad; ctx.fillRect(0,0,size,size); drawLogo(ctx,72,72,178); ctx.fillStyle = '#f1c77c'; ctx.font = '900 28px Inter'; ctx.fillText(post.kicker,72,292); ctx.fillStyle = '#fffaf0'; ctx.font = '800 80px Fraunces'; drawText(ctx,post.title,72,382,690,82,4); ctx.font = '700 33px Inter'; ctx.fillStyle = 'rgba(255,250,240,.88)'; drawText(ctx,post.body,72,708,680,45,4); fillRound(ctx,72,878,468,76,6,'#c99342'); ctx.fillStyle = '#21180b'; ctx.font = '900 27px Inter'; ctx.fillText(post.cta,96,925); }
    function drawSplit(ctx, post) { ctx.fillStyle = '#fffaf0'; ctx.fillRect(0,0,size,size); cover(ctx, loaded[post.image],498,0,582,size); const grad = ctx.createLinearGradient(498,0,718,0); grad.addColorStop(0,'rgba(255,250,240,.94)'); grad.addColorStop(1,'rgba(255,250,240,0)'); ctx.fillStyle = grad; ctx.fillRect(498,0,300,size); fillRound(ctx,64,64,520,952,8,'#253f2f'); drawLogo(ctx,104,112,160); ctx.fillStyle = '#f1c77c'; ctx.font = '900 25px Inter'; ctx.fillText(post.kicker,104,284); ctx.fillStyle = '#fffaf0'; ctx.font = '800 68px Fraunces'; drawText(ctx,post.title,104,372,420,74,4); ctx.font = '700 29px Inter'; ctx.fillStyle = 'rgba(255,250,240,.84)'; drawText(ctx,post.body,104,720,400,40,4); drawCta(ctx,post.cta,104,890,410,70); }
    function drawBand(ctx, post) { cover(ctx, loaded[post.image],0,0,size,size); overlay(ctx,'#17261c',.42); drawLogo(ctx,72,72,170); fillRound(ctx,64,586,952,372,8,'rgba(255,250,240,.95)'); ctx.fillStyle = '#9f5135'; ctx.font = '900 27px Inter'; ctx.fillText(post.kicker,104,650); ctx.fillStyle = '#253f2f'; ctx.font = '800 62px Fraunces'; drawText(ctx,post.title,104,730,800,68,3); ctx.font = '700 28px Inter'; ctx.fillStyle = '#66715f'; drawText(ctx,post.body,104,894,760,38,2); drawCta(ctx,post.cta,654,84,312,66); }
    function drawEditorial(ctx, post) { ctx.fillStyle = '#f3ead8'; ctx.fillRect(0,0,size,size); cover(ctx,loaded[post.image],72,72,936,512); fillRound(ctx,72,548,936,460,8,'#fffaf0'); drawLogo(ctx,114,612,152,false); ctx.fillStyle = '#9f5135'; ctx.font = '900 25px Inter'; ctx.fillText(post.kicker,114,738); ctx.fillStyle = '#253f2f'; ctx.font = '800 62px Fraunces'; drawText(ctx,post.title,114,812,780,66,3); ctx.font = '700 27px Inter'; ctx.fillStyle = '#66715f'; drawText(ctx,post.body,114,952,735,36,2); drawCta(ctx,post.cta,700,622,246,66); }
    function drawPoster(ctx, post) { ctx.fillStyle = '#253f2f'; ctx.fillRect(0,0,size,size); cover(ctx,loaded[post.image],84,84,912,520); ctx.strokeStyle = '#c99342'; ctx.lineWidth = 10; ctx.strokeRect(84,84,912,520); drawLogo(ctx,86,660,156); ctx.fillStyle = '#f1c77c'; ctx.font = '900 27px Inter'; ctx.fillText(post.kicker,86,786); ctx.fillStyle = '#fffaf0'; ctx.font = '800 70px Fraunces'; drawText(ctx,post.title,86,864,850,76,3); ctx.font = '700 28px Inter'; ctx.fillStyle = 'rgba(255,250,240,.78)'; drawText(ctx,post.body,86,1014,560,38,2); drawCta(ctx,post.cta,672,960,322,68); }
    function drawCream(ctx, post) { ctx.fillStyle = '#fffaf0'; ctx.fillRect(0,0,size,size); cover(ctx,loaded[post.image],54,54,972,600); fillRound(ctx,92,610,896,356,8,'#253f2f'); drawLogo(ctx,122,662,150); ctx.fillStyle = '#f1c77c'; ctx.font = '900 25px Inter'; ctx.fillText(post.kicker,122,782); ctx.fillStyle = '#fffaf0'; ctx.font = '800 58px Fraunces'; drawText(ctx,post.title,122,850,700,64,2); drawCta(ctx,post.cta,122,904,358,66); ctx.fillStyle = 'rgba(255,250,240,.82)'; ctx.font = '700 24px Inter'; drawText(ctx,post.body,526,766,390,34,4); }
    function drawPartner(ctx, post) { cover(ctx,loaded[post.image],0,0,size,size); overlay(ctx,'#253f2f',.34); fillRound(ctx,58,58,426,964,8,'rgba(255,250,240,.94)'); drawLogo(ctx,96,104,150,false); ctx.fillStyle = '#9f5135'; ctx.font = '900 24px Inter'; drawText(ctx,post.kicker,96,270,322,31,2); ctx.fillStyle = '#253f2f'; ctx.font = '800 58px Fraunces'; drawText(ctx,post.title,96,380,330,63,5); ctx.font = '700 25px Inter'; ctx.fillStyle = '#66715f'; drawText(ctx,post.body,96,744,322,36,4); drawCta(ctx,post.cta,96,916,300,66); }
    function drawFrame(ctx, post) { ctx.fillStyle = '#17261c'; ctx.fillRect(0,0,size,size); cover(ctx,loaded[post.image],72,72,936,936); overlay(ctx,'#17261c',.2); ctx.strokeStyle = '#c99342'; ctx.lineWidth = 8; ctx.strokeRect(72,72,936,936); fillRound(ctx,112,112,856,302,8,'rgba(255,250,240,.94)'); drawLogo(ctx,146,148,140,false); ctx.fillStyle = '#9f5135'; ctx.font = '900 23px Inter'; ctx.fillText(post.kicker,146,270); ctx.fillStyle = '#253f2f'; ctx.font = '800 52px Fraunces'; drawText(ctx,post.title,146,336,690,56,2); fillRound(ctx,112,792,856,176,8,'rgba(37,63,47,.94)'); ctx.fillStyle = 'rgba(255,250,240,.86)'; ctx.font = '700 27px Inter'; drawText(ctx,post.body,146,850,520,38,3); drawCta(ctx,post.cta,676,848,246,66); }
    function drawImpact(ctx, post) { cover(ctx,loaded[post.image],0,0,size,size); const grad = ctx.createLinearGradient(0,0,0,size); grad.addColorStop(0,'rgba(23,38,28,.16)'); grad.addColorStop(.48,'rgba(23,38,28,.56)'); grad.addColorStop(1,'rgba(23,38,28,.92)'); ctx.fillStyle = grad; ctx.fillRect(0,0,size,size); drawLogo(ctx,72,72,170); ctx.fillStyle = '#f1c77c'; ctx.font = '900 27px Inter'; ctx.fillText(post.kicker,72,602); ctx.fillStyle = '#fffaf0'; ctx.font = '800 76px Fraunces'; drawText(ctx,post.title,72,690,850,82,3); ctx.font = '700 30px Inter'; ctx.fillStyle = 'rgba(255,250,240,.84)'; drawText(ctx,post.body,72,914,650,42,3); drawCta(ctx,post.cta,710,910,310,70); }
    function drawFinalCta(ctx, post) { ctx.fillStyle = '#fffaf0'; ctx.fillRect(0,0,size,size); cover(ctx,loaded[post.image],520,72,488,936); fillRound(ctx,72,72,520,936,8,'#9f5135'); drawLogo(ctx,112,122,156); ctx.fillStyle = '#f1c77c'; ctx.font = '900 27px Inter'; ctx.fillText(post.kicker,112,298); ctx.fillStyle = '#fffaf0'; ctx.font = '800 70px Fraunces'; drawText(ctx,post.title,112,386,390,76,5); ctx.font = '700 29px Inter'; ctx.fillStyle = 'rgba(255,250,240,.84)'; drawText(ctx,post.body,112,750,390,40,4); drawCta(ctx,post.cta,112,910,362,70,'#253f2f','#fffaf0'); }
    function renderPost(canvas, post) { const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,size,size); if (post.style === 'hero') drawHero(ctx,post); if (post.style === 'split') drawSplit(ctx,post); if (post.style === 'band') drawBand(ctx,post); if (post.style === 'editorial') drawEditorial(ctx,post); if (post.style === 'poster') drawPoster(ctx,post); if (post.style === 'cream') drawCream(ctx,post); if (post.style === 'partner') drawPartner(ctx,post); if (post.style === 'frame') drawFrame(ctx,post); if (post.style === 'impact') drawImpact(ctx,post); if (post.style === 'cta') drawFinalCta(ctx,post); }
    async function init() { await document.fonts.ready; await Promise.all(Object.entries(assets).map(async ([key, src]) => { loaded[key] = await loadImage(src); })); const mount = document.getElementById('posts'); posts.forEach((post, index) => { const card = document.createElement('section'); card.className = 'post-card'; const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size; canvas.setAttribute('aria-label', `LAKU Facebook post version ${index + 1}`); const button = document.createElement('button'); button.className = 'download'; button.type = 'button'; button.textContent = `Download Version ${index + 1}`; button.addEventListener('click', () => { renderPost(canvas, post); const link = document.createElement('a'); link.download = post.name; link.href = canvas.toDataURL('image/png'); link.click(); }); card.append(canvas, button); mount.append(card); renderPost(canvas, post); }); }
    init();
  </script>
</body>
</html>
